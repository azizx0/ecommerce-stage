<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 bg-gray-50">
    <div class="w-full max-w-md">
  
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Connexion</h1>
        <p class="mt-2 text-sm text-gray-500">Accédez à votre compte pour continuer</p>
      </div>
  
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white rounded-2xl border border-gray-200 p-8 space-y-5">
  
        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3">
            {{ error() }}
          </div>
        }
  
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" formControlName="email"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                 placeholder="vous@exemple.com">
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <p class="text-xs text-red-500 mt-1">Email invalide</p>
          }
        </div>
  
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
          <input type="password" formControlName="password"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                 placeholder="••••••••">
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
            <p class="text-xs text-red-500 mt-1">Mot de passe requis</p>
          }
        </div>
  
        <button type="submit" [disabled]="loading()"
                class="w-full bg-gray-900 text-white font-medium py-2.5 rounded-lg hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          @if (loading()) {
            Connexion en cours...
          } @else {
            Se connecter
          }
        </button>
  
        <p class="text-center text-sm text-gray-500">
          Pas encore de compte ?
          <a routerLink="/register" class="text-blue-600 font-medium hover:underline">S'inscrire</a>
        </p>
  
      </form>
    </div>
  </div>
